name: GitHub Pages

# Static site only — builds site/ → site/dist and deploys via Actions.
# Enable: repo Settings → Pages → Source: GitHub Actions
# URL: https://doldskrift.github.io/doldskrift/

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build -w doldskrift-site
      - name: Verify static output
        run: |
          test -f site/dist/index.html
          test -f site/dist/lens.html
          test -f site/dist/neural.html
          test -f site/dist/funding.html
          test -f site/dist/install.html
          test -d site/dist/wasm
          test -f site/dist/.nojekyll
          test -f site/dist/logo-mark.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
