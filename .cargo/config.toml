# Windows MSVC default stack (~1MB) is too small for clap's large `dold` subcommand
# enum in debug builds (help/parse can overflow). Release is usually fine.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]
