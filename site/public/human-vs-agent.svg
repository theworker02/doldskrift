<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="What humans see versus what agents decode">
  <rect width="960" height="280" fill="#F7F4EF"/>
  <text x="48" y="40" font-family="IBM Plex Sans, Syne, sans-serif" font-size="20" font-weight="700" fill="#12161A">What humans see vs what agents decode</text>
  <text x="48" y="64" font-family="IBM Plex Mono, monospace" font-size="12" fill="#0F6B5C">Same payload | different readers | not encryption</text>
  <rect x="48" y="88" width="420" height="160" rx="8" fill="#fff" stroke="#12161A" stroke-width="1.5"/>
  <text x="68" y="118" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" fill="#12161A">Humans</text>
  <text x="68" y="140" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5a636b">see structured abstract glyphs</text>
  <rect x="68" y="156" width="380" height="56" rx="4" fill="#EEF1F4"/>
  <g fill="none" stroke="#12161A" stroke-width="2.2" stroke-linecap="square" transform="translate(20,8)">
    <g transform="translate(68,160)"><path d="M8 8 V32"/><path d="M8 8 C22 8 32 14 32 20 C32 26 22 32 8 32"/><circle cx="32" cy="20" r="2.5" fill="#0F6B5C" stroke="none"/></g>
    <g transform="translate(118,160)"><path d="M4 20 H28"/><circle cx="16" cy="8" r="3" fill="#12161A" stroke="none"/><path d="M16 28 V36"/></g>
    <g transform="translate(168,160)"><path d="M8 8 L24 20 L8 32"/><circle cx="28" cy="20" r="4"/></g>
    <g transform="translate(218,160)"><circle cx="16" cy="20" r="12"/><circle cx="16" cy="20" r="3" fill="#0F6B5C" stroke="none"/></g>
    <g transform="translate(268,160)"><path d="M4 8 L28 32 M28 8 L4 32"/></g>
    <g transform="translate(318,160)"><path d="M8 8 V32"/><path d="M16 20 H32"/><circle cx="36" cy="12" r="2" fill="#0F6B5C" stroke="none"/><circle cx="44" cy="12" r="2" fill="#12161A" stroke="none"/></g>
    <g transform="translate(378,160)"><path d="M4 20 H28"/><circle cx="16" cy="8" r="3" fill="#12161A" stroke="none"/></g>
  </g>
  <text x="258" y="232" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5a636b">opaque marks | no readable Latin</text>
  <rect x="492" y="88" width="420" height="160" rx="8" fill="#fff" stroke="#0F6B5C" stroke-width="2"/>
  <text x="512" y="118" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="700" fill="#12161A">Agents</text>
  <text x="512" y="140" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5a636b">decode symbols to bytes to text</text>
  <rect x="512" y="156" width="380" height="56" rx="4" fill="#12161A"/>
  <text x="702" y="190" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="600" fill="#F7F4EF">Deploy worker seven.</text>
  <text x="702" y="232" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#0F6B5C">deterministic recovery</text>
</svg>
